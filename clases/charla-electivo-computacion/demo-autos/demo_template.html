<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La IA aprende a manejar</title>
<style>
@font-face{font-family:"PS2P";src:url(data:font/ttf;base64,__FONT_B64__) format("truetype");}
html,body{margin:0;height:100%;background:#0B1026;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;background:#0B1026}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const W = 480, H = 270;
const cv = document.getElementById("c");
cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

// ── Parámetros ─────────────────────────────────────────
const POP = 80;           // autos por generación
const ELITE = 6;          // los mejores pasan intactos
const NIN = 5, NHID = 6, NOUT = 2;
const RAY = 60;           // largo de los sensores
const ROAD = 16;          // ancho de la pista
const MAX_STEPS = 2600;   // límite por generación (2 vueltas sobran)
const IDLE_MAX = 40;      // sin pasar un checkpoint en tantos pasos = muere
let SEED = 20261104;
let speedMult = 3;        // pasos de simulación por frame (tecla F alterna)

// ── Colores (arcade nocturno) ──────────────────────────
const C = { bg:"#0B1026", road:"#1b2147", edge:"#22E5FF", mark:"#FFE14D",
            mag:"#FF3EA5", cyan:"#22E5FF", yel:"#FFE14D", grn:"#3DFF8A", wht:"#F5F7FF",
            dim:"#8290af", grid:"#141a3d" };

// ── Azar con semilla (resultado reproducible) ──────────
let rnd;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

// ── Pista: spline cerrado (Catmull-Rom) ────────────────
const ctrl = [[60,60],[150,35],[250,50],[300,100],[255,140],[300,190],[250,235],[150,215],[90,240],[40,190],[72,140],[30,100]];
const center = [];
(function(){
  const n = ctrl.length;
  for (let i=0;i<n;i++){
    const p0=ctrl[(i-1+n)%n],p1=ctrl[i],p2=ctrl[(i+1)%n],p3=ctrl[(i+2)%n];
    for (let t=0;t<1;t+=1/20){
      const t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      center.push([f(p0[0],p1[0],p2[0],p3[0]), f(p0[1],p1[1],p2[1],p3[1])]);
    }
  }
})();
const cps = center.filter((_,i)=>i%5===0);   // checkpoints
const NCP = cps.length;

function strokeTrack(c,w,col){
  c.strokeStyle=col;c.lineWidth=w;c.lineJoin="round";c.beginPath();
  center.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
  c.closePath();c.stroke();
}
// máscara de colisión
const mask = document.createElement("canvas"); mask.width=W; mask.height=H;
const mctx = mask.getContext("2d");
strokeTrack(mctx, ROAD, "#fff");
const md = mctx.getImageData(0,0,W,H).data;
const road = new Uint8Array(W*H);
for (let i=0;i<W*H;i++) road[i] = md[i*4+3] > 127 ? 1 : 0;
// fondo estático
const bg = document.createElement("canvas"); bg.width=W; bg.height=H;
(function(){
  const b = bg.getContext("2d"); b.imageSmoothingEnabled=false;
  b.fillStyle=C.bg; b.fillRect(0,0,W,H);
  b.fillStyle=C.grid;
  for (let x=0;x<W;x+=16) b.fillRect(x,0,1,H);
  for (let y=0;y<H;y+=16) b.fillRect(0,y,W,1);
  strokeTrack(b, ROAD+4, C.edge);
  strokeTrack(b, ROAD, C.road);
  b.strokeStyle=C.mark; b.lineWidth=1; b.setLineDash([4,6]);
  b.beginPath(); center.forEach((p,i)=>i?b.lineTo(p[0],p[1]):b.moveTo(p[0],p[1])); b.closePath(); b.stroke();
  b.setLineDash([]);
  // línea de meta
  const s=center[0], n=center[1], a=Math.atan2(n[1]-s[1],n[0]-s[0]);
  b.save(); b.translate(s[0],s[1]); b.rotate(a+Math.PI/2);
  for (let i=-7;i<7;i++){ b.fillStyle=(i&1)?"#fff":"#111"; b.fillRect(i*2.2,-2,2.2,4); }
  b.restore();
})();

// ── Cerebro: red 5→6→2 (50 genes) ──────────────────────
const NGENES = NIN*NHID+NHID + NHID*NOUT+NOUT;
function randomGenome(){ const g=new Float32Array(NGENES); for(let i=0;i<NGENES;i++) g[i]=rnd()*2-1; return g; }
function forward(g, inp, act){
  let k=0; const hid=act.hid, out=act.out;
  for (let h=0;h<NHID;h++){ let s=0; for(let i=0;i<NIN;i++) s+=inp[i]*g[k++]; s+=g[k++]; hid[h]=Math.tanh(s); }
  for (let o=0;o<NOUT;o++){ let s=0; for(let h=0;h<NHID;h++) s+=hid[h]*g[k++]; s+=g[k++]; out[o]=Math.tanh(s); }
}

// ── Auto ───────────────────────────────────────────────
const ANG = [-0.9,-0.45,0,0.45,0.9];
class Car {
  constructor(g){ this.g=g; this.act={hid:new Float32Array(NHID),out:new Float32Array(NOUT)};
    this.inp=new Float32Array(NIN); this.reset(); }
  reset(){
    const s=center[0], n=center[1];
    this.x=s[0]; this.y=s[1]; this.a=Math.atan2(n[1]-s[1],n[0]-s[0]);
    this.v=1.5; this.alive=true; this.passed=0; this.idle=0; this.t=0; this.lapAt=-1; this.fit=0;
  }
  sense(){
    for (let r=0;r<NIN;r++){
      const ca=Math.cos(this.a+ANG[r]), sa=Math.sin(this.a+ANG[r]); let d=0;
      while (d<RAY){
        const px=Math.round(this.x+ca*d), py=Math.round(this.y+sa*d);
        if (px<0||py<0||px>=W||py>=H||!road[py*W+px]) break;
        d+=2;
      }
      this.inp[r]=d/RAY;
    }
  }
  step(){
    if (!this.alive) return;
    this.sense();
    forward(this.g, this.inp, this.act);
    this.a += this.act.out[0]*0.10;
    this.v = 1.1 + (this.act.out[1]+1)*0.75;
    this.x += Math.cos(this.a)*this.v; this.y += Math.sin(this.a)*this.v;
    this.t++;
    const px=Math.round(this.x), py=Math.round(this.y);
    if (px<0||py<0||px>=W||py>=H||!road[py*W+px]){ this.alive=false; }
    const tgt=cps[(this.passed+1)%NCP];
    const dx=tgt[0]-this.x, dy=tgt[1]-this.y, dist=Math.hypot(dx,dy);
    if (dist<ROAD*0.55){
      this.passed++; this.idle=0;
      if (this.passed===NCP && this.lapAt<0) this.lapAt=this.t;
    } else if (++this.idle>IDLE_MAX) this.alive=false;
    this.fit = this.passed*100 + (100-Math.min(100,dist));
    if (this.passed>=NCP*2) this.alive=false;   // 2 vueltas: suficiente
  }
}

// ── Evolución ──────────────────────────────────────────
let cars=[], gen=1, steps=0, bestLapFrames=-1, lapBanner=0, lapGen=-1, bestEver=0, paused=false;
function init(){
  rnd = mulberry32(SEED); gen=1; steps=0; bestLapFrames=-1; lapBanner=0; lapGen=-1; bestEver=0;
  cars=[]; for(let i=0;i<POP;i++) cars.push(new Car(randomGenome()));
}
function mutate(g){
  const c=new Float32Array(g);
  for(let i=0;i<NGENES;i++){ if(rnd()<0.18) c[i]+=gauss()*0.35; if(rnd()<0.01) c[i]=rnd()*2-1; }
  return c;
}
function cross(a,b){ const c=new Float32Array(NGENES); for(let i=0;i<NGENES;i++) c[i]=rnd()<0.5?a[i]:b[i]; return c; }
function nextGen(){
  const sorted=[...cars].sort((a,b)=>b.fit-a.fit);
  bestEver=Math.max(bestEver,sorted[0].passed);
  const pool=sorted.slice(0,Math.floor(POP*0.25));
  const pick=()=>{ let b=pool[Math.floor(rnd()*pool.length)]; for(let i=0;i<2;i++){const c=pool[Math.floor(rnd()*pool.length)]; if(c.fit>b.fit)b=c;} return b.g; };
  const next=[]; for(let i=0;i<ELITE;i++) next.push(new Car(new Float32Array(sorted[i].g)));
  while(next.length<POP) next.push(new Car(mutate(rnd()<0.5?cross(pick(),pick()):pick())));
  cars=next; gen++; steps=0;
}
function simStep(){
  let alive=0;
  for (const c of cars){ c.step(); if(c.alive) alive++; }
  steps++;
  for (const c of cars){
    if (c.lapAt>=0 && lapGen!==gen && c.lapAt>0){ lapGen=gen; lapBanner=240;
      if (bestLapFrames<0 || c.lapAt<bestLapFrames) bestLapFrames=c.lapAt; }
    if (c.lapAt>0 && (bestLapFrames<0 || c.lapAt<bestLapFrames)) bestLapFrames=c.lapAt;
  }
  if (alive===0 || steps>MAX_STEPS) nextGen();
}

// ── Dibujo ─────────────────────────────────────────────
function txt(s,x,y,col,size){ ctx.font=(size||8)+"px PS2P"; ctx.fillStyle=col||C.wht; ctx.textBaseline="top"; ctx.fillText(s,x,y); }
function leader(){ let b=null; for(const c of cars){ if(c.alive&&(!b||c.fit>b.fit)) b=c; } return b || cars[0]; }
function drawNet(c){
  const ix=372, hx=420, ox=462;
  const iy=i=>112+i*20, hy=i=>104+i*16, oy=i=>128+i*32;
  const g=c.g; let k=0;
  // aristas entrada→oculta
  for(let h=0;h<NHID;h++){ for(let i=0;i<NIN;i++){ const w=g[k++];
      ctx.globalAlpha=Math.min(1,0.15+Math.abs(w)*0.5*(0.3+c.inp[i]));
      ctx.strokeStyle=w>0?C.cyan:C.mag; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(ix,iy(i)); ctx.lineTo(hx,hy(h)); ctx.stroke(); } k++; }
  for(let o=0;o<NOUT;o++){ for(let h=0;h<NHID;h++){ const w=g[k++];
      ctx.globalAlpha=Math.min(1,0.15+Math.abs(w)*0.5*(0.3+Math.abs(c.act.hid[h])));
      ctx.strokeStyle=w>0?C.cyan:C.mag; ctx.beginPath(); ctx.moveTo(hx,hy(h)); ctx.lineTo(ox,oy(o)); ctx.stroke(); } k++; }
  ctx.globalAlpha=1;
  const node=(x,y,v,col)=>{ ctx.fillStyle=C.road; ctx.fillRect(x-4,y-4,8,8); ctx.globalAlpha=0.25+0.75*Math.min(1,Math.abs(v)); ctx.fillStyle=col; ctx.fillRect(x-3,y-3,6,6); ctx.globalAlpha=1; };
  for(let i=0;i<NIN;i++) node(ix,iy(i),c.inp[i],C.yel);
  for(let h=0;h<NHID;h++) node(hx,hy(h),c.act.hid[h],C.grn);
  node(ox,oy(0),c.act.out[0],C.mag); node(ox,oy(1),c.act.out[1],C.cyan);
  txt("VE",ix-8,208,C.yel,6); txt("PIENSA",hx-24,208,C.grn,6); txt("ACTUA",ox-20,208,C.mag,6);
  ctx.fillStyle="#070a1a"; ctx.fillRect(ox-34,oy(0)-17,34,8); ctx.fillRect(ox-38,oy(1)+9,38,8);
  txt("GIRA",ox-32,oy(0)-16,C.mag,6); txt("ACEL.",ox-36,oy(1)+10,C.cyan,6);
}
function draw(){
  ctx.drawImage(bg,0,0);
  const L = leader();
  // autos
  for (const c of cars){
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.a);
    if (!c.alive){ ctx.globalAlpha=0.28; ctx.fillStyle=C.dim; ctx.fillRect(-3,-2,6,4); }
    else if (c===L){ ctx.fillStyle=C.yel; ctx.fillRect(-4,-2.5,8,5); ctx.fillStyle="#fff"; ctx.fillRect(1,-2,2,4); }
    else { ctx.globalAlpha=0.85; ctx.fillStyle=C.mag; ctx.fillRect(-3,-2,6,4); ctx.fillStyle="#fff"; ctx.fillRect(1,-1.5,1.5,3); }
    ctx.restore();
  }
  // rayos del líder
  if (L && L.alive){
    ctx.strokeStyle=C.cyan; ctx.globalAlpha=0.7; ctx.lineWidth=1;
    for(let r=0;r<NIN;r++){ const d=L.inp[r]*RAY; ctx.beginPath(); ctx.moveTo(L.x,L.y);
      ctx.lineTo(L.x+Math.cos(L.a+ANG[r])*d, L.y+Math.sin(L.a+ANG[r])*d); ctx.stroke(); }
    ctx.globalAlpha=1;
  }
  // panel derecho
  ctx.fillStyle="#070a1a"; ctx.fillRect(340,0,140,H);
  ctx.fillStyle=C.cyan; ctx.fillRect(340,0,2,H);
  const vivos=cars.filter(c=>c.alive).length;
  txt("GEN "+String(gen).padStart(2,"0"),350,10,C.yel,8);
  txt("VIVOS "+String(vivos).padStart(2,"0")+"/"+POP,350,26,C.wht,8);
  const prog=Math.min(100,Math.round(100*Math.max(...cars.map(c=>c.passed))/NCP));
  txt("VUELTA "+prog+"%",350,42,C.grn,8);
  ctx.fillStyle=C.road; ctx.fillRect(350,56,120,6); ctx.fillStyle=C.grn; ctx.fillRect(350,56,Math.round(1.2*prog),6);
  if (bestLapFrames>0) txt("MEJOR "+(bestLapFrames/60).toFixed(1)+"s",350,70,C.yel,8);
  txt("CEREBRO",350,86,C.cyan,8); txt("DEL LIDER",350,96,C.cyan,6);
  if (L) drawNet(L);
  txt("F:RAPIDO  ESP:PAUSA",348,250,C.dim,6);
  // texto explicativo en el centro de la pista
  if (lapBanner<=0){
    txt("80 CEREBROS",112,118,C.wht,8); txt("AL AZAR...",112,130,C.wht,8);
    txt("LOS MEJORES",112,148,C.yel,8); txt("PASAN SUS",112,160,C.yel,8); txt("GENES",112,172,C.yel,8);
  }
  // título
  txt("LA IA APRENDE A MANEJAR",8,8,C.wht,8);
  // banner de vuelta completa
  if (lapBanner>0){
    const on=(Math.floor(lapBanner/12)%2)===0;
    ctx.fillStyle="rgba(7,10,26,0.8)"; ctx.fillRect(70,112,200,46);
    ctx.strokeStyle=C.yel; ctx.lineWidth=2; ctx.strokeRect(70,112,200,46);
    if (on){ txt("VUELTA COMPLETA!",80,124,C.yel,10); }
    txt("GENERACION "+lapGen,98,142,C.cyan,8);
  }
  if (paused) txt("PAUSA",150,128,C.yel,16);
}
function frame(){
  if (!paused) { for(let i=0;i<speedMult;i++) simStep(); if(lapBanner>0) lapBanner--; }
  draw(); requestAnimationFrame(frame);
}

// ── Teclas ─────────────────────────────────────────────
addEventListener("keydown",e=>{
  if (e.code==="Space"){ paused=!paused; e.preventDefault(); }
  else if (e.key==="f"||e.key==="F"){ speedMult = speedMult===3 ? 8 : 3; }
  else if (e.key==="r"||e.key==="R"){ if(e.shiftKey) SEED=Math.floor(Math.random()*1e9); init(); }
});

// ── Prueba sin dibujar (para calibrar): window.__tune(maxGen) ──
window.__tune = function(maxGen){
  init(); let g0=null;
  while (gen<=maxGen){ simStep(); if(lapGen===gen && g0===null){ g0=gen; break; } }
  return { genConVuelta: g0, gen, bestEver, bestLapFrames };
};

document.fonts.load("8px PS2P").then(()=>{ init();
  const skip=+(new URLSearchParams(location.search).get("skip")||0);  // ?skip=N avanza N pasos (pruebas)
  for(let i=0;i<skip;i++) simStep();
  requestAnimationFrame(frame); });
</script>
</body>
</html>
